<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Belajar - InkuLearn</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="videobelajar.css">
    <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/open-dyslexic">
</head>
<body>
    <div class="bg-wrapper"></div>
    
    <div class="main-container">
        <div class="video-card">
            <h1 class="video-title">Video Pembelajaran</h1>
            
            <div class="video-container">
                <div id="player"></div>
                
                <div class="video-controls">
                    <div class="controls-container">
                        <button id="playPauseBtn" class="control-btn">
                            <i class="fas fa-play"></i>
                        </button>
                        <button id="fullscreenBtn" class="control-btn">
                            <i class="fas fa-expand"></i>
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="navigation-buttons">
                <button id="backBtn" class="back-btn">
                    <img src="backbutton.png" alt="Back" class="back-icon">
                </button>
            </div>
        </div>
    </div>
    
    <!-- Modal -->
    <div id="confirmModal" class="modal">
        <div class="modal-content">
            <h2>Konfirmasi</h2>
            <p>Apakah anda ingin keluar dari video belajar?</p>
            <div class="modal-buttons">
                <button id="noBtn" class="modal-btn no-btn">Tidak</button>
                <button id="yesBtn" class="modal-btn yes-btn">Ya</button>
            </div>
        </div>
    </div>
    
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="videobelajar.js"></script>
</body>
</html>
